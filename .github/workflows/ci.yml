name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:  # release.yml runs this before it builds

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - run: pip install "ruff==0.16.8"
      - run: ruff check .
      - run: ruff format --check .

  test:
    # The suite without fixtures or golden traces: synthetic traces and contracts, the
    # verdict table, the comparator, infer and the residual. Tests that need downloaded
    # policies or recorded traces skip and name what is missing.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.13"
    env:
      GAITKEEPER_DATA: ${{ github.workspace }}/.no-fixtures
      MUJOCO_GL: disable  # nothing in the suite renders; import mujoco then loads no GL library
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,sim]"
      - run: python -m pytest -q -rs
