# Shaped like the params/env.yaml Isaac Lab writes (values written for the tests, trimmed).
sim:
  dt: 0.005
  gravity: !!python/tuple
  - 0.0
  - 0.0
  - -9.81
decimation: 4
scene:
  robot:
    class_type: isaaclab.assets.articulation.articulation:Articulation
    init_state:
      pos: !!python/tuple [0.0, 0.0, 0.8]
      joint_pos:
        .*_hip_pitch_joint: -0.1
        .*_knee_joint: 0.3
        .*_ankle_pitch_joint: -0.2
        .*_shoulder_pitch_joint: 0.3
        left_shoulder_roll_joint: 0.25
        right_shoulder_roll_joint: -0.25
        .*_elbow_joint: 0.97
    actuators:
      legs:
        class_type: isaaclab.actuators.actuator_pd:ImplicitActuator
        joint_names_expr: [.*_hip_.*, .*_knee_.*, waist_yaw_joint]
        effort_limit_sim: 88
        velocity_limit_sim: 32.0
        stiffness:
          .*_hip_.*: 100.0
          .*_knee_.*: 150.0
          waist_yaw_joint: 200.0
        damping: 2.0
        armature: 0.01
      rest:
        class_type: isaaclab.actuators.actuator_pd:ImplicitActuator
        joint_names_expr: [.*_ankle_.*, waist_roll_joint, waist_pitch_joint, .*_shoulder_.*, .*_elbow_.*, .*_wrist_.*]
        effort_limit_sim: 25
        velocity_limit_sim: 37
        stiffness: 40.0
        damping:
          .*_ankle_.*: 2.0
          waist_.*_joint: 5.0
          .*_shoulder_.*: 1.0
          .*_elbow_.*: 1.0
          .*_wrist_.*: 1.0
        armature: 0.01
observations:
  policy:
    concatenate_terms: true
    enable_corruption: true
    history_length: 5
    flatten_history_dim: true
    base_ang_vel:
      func: isaaclab.envs.mdp.observations:base_ang_vel
      params: {}
      noise: {func: "isaaclab.utils.noise.noise_model:uniform_noise", n_min: -0.2, n_max: 0.2}
      clip: null
      scale: 0.2
      history_length: 0
    projected_gravity:
      func: isaaclab.envs.mdp.observations:projected_gravity
      params: {}
      clip: null
      scale: null
      history_length: 0
    velocity_commands:
      func: isaaclab.envs.mdp.observations:generated_commands
      params: {command_name: base_velocity}
      clip: null
      scale: null
      history_length: 0
    joint_pos_rel:
      func: isaaclab.envs.mdp.observations:joint_pos_rel
      params: {}
      clip: null
      scale: null
      history_length: 0
    joint_vel_rel:
      func: isaaclab.envs.mdp.observations:joint_vel_rel
      params: {}
      clip: !!python/tuple [-100.0, 100.0]
      scale: 0.05
      history_length: 0
    last_action:
      func: isaaclab.envs.mdp.observations:last_action
      params: {}
      clip: null
      scale: null
      history_length: 0
    gait_phase:
      func: unitree_rl_lab.tasks.locomotion.mdp.observations:gait_phase
      params: {period: 0.8}
      clip: null
      scale: null
      history_length: 0
actions:
  JointPositionAction:
    class_type: isaaclab.envs.mdp.actions.joint_actions:JointPositionAction
    clip: null
    joint_names: [.*]
    scale: 0.25
    preserve_order: false
    use_default_offset: true
curriculum:
  lin_vel_cmd_levels:
    func: unitree_rl_lab.tasks.locomotion.mdp.curriculums:lin_vel_cmd_levels
    params: {}
commands:
  base_velocity:
    heading_command: false
    ranges:
      lin_vel_x: !!python/tuple [-0.1, 0.1]
      lin_vel_y: !!python/tuple [-0.1, 0.1]
      ang_vel_z: !!python/tuple [-0.1, 0.1]
      heading: null
    limit_ranges:
      lin_vel_x: !!python/tuple [-0.5, 1.0]
      lin_vel_y: !!python/tuple [-0.3, 0.3]
      ang_vel_z: !!python/tuple [-0.2, 0.2]
      heading: null
