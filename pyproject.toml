[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim2sim"
version = "0.0.1"
description = "Check a locomotion policy's deployment contract against ground truth recorded in its training simulator."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Dundy Pasupuleti", email = "dundysm@gmail.com" }]
dependencies = ["numpy>=1.24", "pyyaml>=6", "onnxruntime>=1.16"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "onnx>=1.15"]
# The closed-loop runner, checks and envelope simulate in MuJoCo on the CPU.
sim = ["mujoco>=3.3"]
# The recorder runs inside the training stack. For mjlab it needs the pinned
# versions below; they are listed for reference and installed separately.
record-mjlab = ["mjlab==1.2.0", "mujoco==3.5.0", "mujoco-warp==3.5.0", "warp-lang==1.12.*", "scipy"]

[project.scripts]
sim2sim = "sim2sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
