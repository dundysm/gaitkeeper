name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.4"
      - run: ruff check .
      - run: ruff format --check .

  test:
    # The suite without fixtures or golden traces: synthetic traces and contracts, the
    # verdict table, the comparator, infer and the residual. Tests that need downloaded
    # policies or recorded traces skip and name what is missing.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    env:
      GAITKEEPER_DATA: ${{ github.workspace }}/.no-fixtures
      MUJOCO_GL: egl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,sim]"
      - run: python -m pytest -q -rs
